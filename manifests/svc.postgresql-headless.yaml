apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: shortener
  labels:
    app: shortener
    rel: canary
    tier: database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
      app: shortener
      tier: database
  ports:
  - name: postgresdb
    port: 5432
    targetPort: postgresdb
    protocol: TCP
