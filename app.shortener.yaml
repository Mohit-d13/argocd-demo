apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortener
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Mohit-d13/argocd-demo.git'
    targetRevision: HEAD
    path: manifests/
  destination:
    namespace: shortener
    name: in-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m 
